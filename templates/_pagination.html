{% load i18n %}{% if page.has_other_pages %}
<nav class="pagination">
  {% if page.has_previous %}<a class="btn btn-ghost btn-sm" href="?page={{ page.previous_page_number }}">{% trans "Previous" %}</a>{% endif %}
  <span class="muted">{% blocktrans with n=page.number total=page.paginator.num_pages %}Page {{ n }} of {{ total }}{% endblocktrans %}</span>
  {% if page.has_next %}<a class="btn btn-ghost btn-sm" href="?page={{ page.next_page_number }}">{% trans "Next" %}</a>{% endif %}
</nav>
{% endif %}
